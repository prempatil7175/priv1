<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="p12-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F2F8FF"/>
      <stop offset="100%" stop-color="#D0E3F8"/>
    </radialGradient>
    <filter id="p12-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#5B87B5" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="160" cy="160" r="145" fill="url(#p12-bg)" stroke="#98C0EC" stroke-width="3" stroke-dasharray="6,6"/>
  <!-- Apology aura glow -->
  <circle cx="160" cy="140" r="85" fill="#FFE066" opacity="0.15"/>
  
  <g filter="url(#p12-shadow)">
    <!-- Cat Ears drooping back in guilt -->
    <polygon points="105,108 112,58 142,95" fill="#FFFDF8" stroke="#3D3238" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="112,103 118,70 136,98" fill="#FFAEC0"/>
    <polygon points="215,108 208,58 178,95" fill="#FFFDF8" stroke="#3D3238" stroke-width="3.5" stroke-linejoin="round"/>
    <polygon points="208,103 202,70 184,98" fill="#FFAEC0"/>
    
    <!-- Body -->
    <ellipse cx="160" cy="225" rx="60" ry="54" fill="#FFFDF8" stroke="#3D3238" stroke-width="3.5"/>
    <ellipse cx="160" cy="235" rx="38" ry="34" fill="#FFF0F5"/>
    <!-- Feet sitting -->
    <ellipse cx="115" cy="270" rx="16" ry="10" fill="#FFFDF8" stroke="#3D3238" stroke-width="3"/>
    <ellipse cx="205" cy="270" rx="16" ry="10" fill="#FFFDF8" stroke="#3D3238" stroke-width="3"/>
    
    <!-- Cat Head -->
    <ellipse cx="160" cy="135" rx="56" ry="46" fill="#FFFDF8" stroke="#3D3238" stroke-width="3.5"/>
    
    <!-- Eyes with dramatic anime tears streaming -->
    <ellipse cx="138" cy="132" rx="9" ry="12" fill="#2E2420"/>
    <circle cx="134" cy="128" r="3.5" fill="#FFF"/>
    <circle cx="140" cy="136" r="1.5" fill="#FFF"/>
    
    <ellipse cx="182" cy="132" rx="9" ry="12" fill="#2E2420"/>
    <circle cx="178" cy="128" r="3.5" fill="#FFF"/>
    <circle cx="184" cy="136" r="1.5" fill="#FFF"/>
    
    <!-- Dramatic Cute Waterfall Anime Tears -->
    <path d="M128,140 C118,155 110,185 118,215 C122,225 128,215 126,195 C125,180 132,155 130,140 Z" fill="#60A5FA" opacity="0.85"/>
    <path d="M192,140 C202,155 210,185 202,215 C198,225 192,215 194,195 C195,180 188,155 190,140 Z" fill="#60A5FA" opacity="0.85"/>
    <!-- Tear splashes -->
    <ellipse cx="118" cy="225" rx="8" ry="3" fill="#60A5FA" opacity="0.7"/>
    <ellipse cx="202" cy="225" rx="8" ry="3" fill="#60A5FA" opacity="0.7"/>
    
    <!-- Blush -->
    <ellipse cx="125" cy="145" rx="8" ry="5" fill="#FF8CA3" opacity="0.6"/>
    <ellipse cx="195" cy="145" rx="8" ry="5" fill="#FF8CA3" opacity="0.6"/>
    
    <!-- Quivering crying mouth & nose -->
    <polygon points="157,142 163,142 160,146" fill="#FF8FA3"/>
    <path d="M152,153 Q160,147 168,153" stroke="#3D3238" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Whiskers -->
    <line x1="98" y1="140" x2="115" y2="142" stroke="#3D3238" stroke-width="2" stroke-linecap="round"/>
    <line x1="96" y1="149" x2="114" y2="148" stroke="#3D3238" stroke-width="2" stroke-linecap="round"/>
    <line x1="222" y1="140" x2="205" y2="142" stroke="#3D3238" stroke-width="2" stroke-linecap="round"/>
    <line x1="224" y1="149" x2="206" y2="148" stroke="#3D3238" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Paws folded together in earnest prayer / begging 🙏 -->
    <g transform="translate(142, 185)">
      <ellipse cx="12" cy="15" rx="10" ry="18" fill="#FFFDF8" stroke="#3D3238" stroke-width="3" transform="rotate(-12 12 15)"/>
      <ellipse cx="24" cy="15" rx="10" ry="18" fill="#FFFDF8" stroke="#3D3238" stroke-width="3" transform="rotate(12 24 15)"/>
      <line x1="18" y1="5" x2="18" y2="28" stroke="#FFBCC9" stroke-width="2"/>
    </g>
  </g>
</svg>

