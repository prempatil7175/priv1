<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="p13-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#FFECCC"/>
    </radialGradient>
    <filter id="p13-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#A56E30" flood-opacity="0.25"/>
    </filter>
  </defs>
  <circle cx="160" cy="160" r="145" fill="url(#p13-bg)" stroke="#F5C782" stroke-width="3" stroke-dasharray="6,6"/>
  <!-- Hearts floating around monkey -->
  <path d="M55,100 C45,85 25,95 35,110 L55,130 L75,110 C85,95 65,85 55,100 Z" fill="#FF758F" opacity="0.6"/>
  <path d="M265,100 C255,85 235,95 245,110 L265,130 L285,110 C295,95 275,85 265,100 Z" fill="#FF758F" opacity="0.6"/>
  
  <g filter="url(#p13-shadow)">
    <!-- Monkey Tail with cute curl -->
    <path d="M100,245 C65,245 45,210 65,190 C78,175 95,190 85,202 C75,212 85,228 105,225" fill="none" stroke="#7A4E2D" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Big Monkey Round Ears -->
    <circle cx="95" cy="145" r="26" fill="#7A4E2D" stroke="#4A2E17" stroke-width="3.5"/>
    <circle cx="95" cy="145" r="16" fill="#F8D5B0"/>
    <circle cx="225" cy="145" r="26" fill="#7A4E2D" stroke="#4A2E17" stroke-width="3.5"/>
    <circle cx="225" cy="145" r="16" fill="#F8D5B0"/>
    
    <!-- Monkey Body -->
    <ellipse cx="160" cy="235" rx="58" ry="50" fill="#7A4E2D" stroke="#4A2E17" stroke-width="3.5"/>
    <ellipse cx="160" cy="242" rx="40" ry="34" fill="#F8D5B0"/>
    
    <!-- Monkey Feet -->
    <ellipse cx="115" cy="280" rx="18" ry="12" fill="#F8D5B0" stroke="#4A2E17" stroke-width="3"/>
    <ellipse cx="205" cy="280" rx="18" ry="12" fill="#F8D5B0" stroke="#4A2E17" stroke-width="3"/>
    
    <!-- Monkey Head -->
    <circle cx="160" cy="150" r="52" fill="#7A4E2D" stroke="#4A2E17" stroke-width="3.5"/>
    <!-- Heart-shaped Peach Face Mask -->
    <path d="M160,132 C145,110 115,120 120,150 C125,178 160,192 160,192 C160,192 195,178 200,150 C205,120 175,110 160,132 Z" fill="#F8D5B0" stroke="#4A2E17" stroke-width="2.5"/>
    
    <!-- Big Playful Smiling Eyes -->
    <ellipse cx="142" cy="145" rx="8" ry="10" fill="#2E1D11"/>
    <circle cx="139" cy="141" r="3" fill="#FFF"/>
    <circle cx="144" cy="148" r="1.5" fill="#FFF"/>
    
    <ellipse cx="178" cy="145" rx="8" ry="10" fill="#2E1D11"/>
    <circle cx="175" cy="141" r="3" fill="#FFF"/>
    <circle cx="180" cy="148" r="1.5" fill="#FFF"/>
    
    <!-- Cheek Blush -->
    <ellipse cx="128" cy="158" rx="8" ry="5" fill="#FF8CA3" opacity="0.6"/>
    <ellipse cx="192" cy="158" rx="8" ry="5" fill="#FF8CA3" opacity="0.6"/>
    
    <!-- Nose & Big Cheeky Happy Smile -->
    <ellipse cx="160" cy="156" rx="4" ry="3" fill="#6A3B18"/>
    <path d="M145,165 Q160,180 175,165" stroke="#4A2E17" stroke-width="3" fill="#FF758F" stroke-linecap="round"/>
    
    <!-- Monkey Arms Curved Up Above Head Forming A Heart Shape 💖 -->
    <path d="M110,215 C85,150 110,65 160,85 C210,65 235,150 210,215" fill="none" stroke="#7A4E2D" stroke-width="14" stroke-linecap="round"/>
    <path d="M110,215 C85,150 110,65 160,85 C210,65 235,150 210,215" fill="none" stroke="#4A2E17" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Hands meeting at top of heart -->
    <circle cx="160" cy="85" r="9" fill="#F8D5B0" stroke="#4A2E17" stroke-width="2.5"/>
    
    <!-- Glowing Heart suspended inside the arm arch -->
    <path d="M160,60 C150,45 130,55 140,70 L160,90 L180,70 C190,55 170,45 160,60 Z" fill="#FF3366" stroke="#C9184A" stroke-width="2"/>
    <circle cx="152" cy="62" r="2.5" fill="#FFF" opacity="0.8"/>
  </g>
</svg>

